<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Techs AppStore</title>
    <meta name="description" content="Download the latest premium apps and games directly to your device.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#024773">
    <link rel="apple-touch-icon" href="assets/logo.jpg">
    <!-- PWA Install Early Listener -->
    <script>
        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredPrompt = e;
            const btn = document.getElementById('pwa-install-btn');
            if (btn) btn.style.display = 'flex';
            
            // Auto-show popup on big screens if not dismissed before
            if (window.innerWidth >= 768 && !localStorage.getItem('pwa-popup-dismissed')) {
                setTimeout(() => {
                    const modal = document.getElementById('install-modal');
                    if (modal && window.deferredPrompt && !localStorage.getItem('pwa-popup-dismissed')) {
                        modal.classList.add('active');
                    }
                }, 30000);
            }
        });
    </script>
</head>
<body>
    <!-- Sci-Fi Geometric Background -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
    </div>

    <!-- Top Header -->
    <header class="top-header">
        <div class="nav-container">
            <a href="https://t.me/+ij7-LS669ahhMDFk" target="_blank" rel="noopener noreferrer" class="nav-brand" style="text-decoration: none;">
                <div class="logo-container">
                    <div class="logo-glow"></div>
                    <img src="assets/logo.jpg" alt="Premium Tech" class="brand-logo" onerror="this.src='https://ui-avatars.com/api/?name=PT&background=00a8e8&color=fff&rounded=true'">
                </div>
                <span class="brand-text">Premium Techs</span>
            </a>

            <div class="search-container">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="البحث عن تطبيقات وألعاب...">
                    <button id="filter-toggle" class="filter-toggle" aria-label="Toggle Filters">
                        <i class="fa-solid fa-sliders"></i>
                    </button>
                </div>
                
                <div id="filter-panel" class="filter-panel" style="display: none;">
                    <div class="filter-group">
                        <label id="label-sort">ترتيب حسب</label>
                        <select id="sort-select">
                            <option value="new" id="opt-sort-new">الأحدث</option>
                            <option value="old" id="opt-sort-old">الأقدم</option>
                            <option value="name_asc" id="opt-sort-asc">الاسم (أ-ي)</option>
                            <option value="name_desc" id="opt-sort-desc">الاسم (ي-أ)</option>
                            <option value="size_asc" id="opt-size-asc">الحجم (الأصغر)</option>
                            <option value="size_desc" id="opt-size-desc">الحجم (الأكبر)</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="label-size">حجم الملف</label>
                        <select id="size-select">
                            <option value="all" id="opt-size-all">الكل</option>
                            <option value="small" id="opt-size-small">أصغر من 20MB (مباشر)</option>
                            <option value="large" id="opt-size-large">أكبر من 20MB (تليجرام)</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label id="label-category">التصنيف</label>
                        <select id="category-select">
                            <option value="all" id="opt-cat-all">الكل</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" title="تغيير المظهر">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button id="lang-toggle" class="icon-btn" title="تغيير اللغة">
                    <i class="fa-solid fa-language"></i>
                </button>
            </div>
            
            <div class="desktop-tabs-wrapper">
                <!-- Desktop Tabs (Visible only on large screens, centered) -->
                <div class="desktop-tabs">
                    <button class="desktop-tab active" data-view="home">الرئيسية</button>
                    <button class="desktop-tab" data-view="apps">التطبيقات</button>
                    <button class="desktop-tab" data-view="games">الألعاب</button>
                    <button class="desktop-tab" data-view="categories">التصنيفات</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- Banners Section (Only visible on Home) -->
        <section id="banners-section" class="banners-slider">
            <!-- Banners injected dynamically by JS -->
        </section>

        <!-- Categories Page (Tags) -->
        <section id="categories-page" class="page">
            <h2 class="section-title" id="categories-title">التصنيفات</h2>
            <div id="categories-grid" class="categories-grid">
                <!-- Category cards injected here -->
            </div>
        </section>

        <!-- Main Apps Grid -->
        <section id="apps-page" class="page active">
            <!-- Home Actions (Visible only on Home) -->
            <div id="home-actions" class="home-actions-container">
                <a href="https://t.me/+ij7-LS669ahhMDFk" target="_blank" rel="noopener noreferrer" class="download-btn btn-large action-btn">
                    <i class="fa-solid fa-user-plus"></i>
                    <span id="btn-join-text">انضمام للقناة</span>
                </a>
                <a href="https://t.me/IA_Assistantbot" target="_blank" rel="noopener noreferrer" class="download-btn btn-large action-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span id="btn-request-text">اطلب تطبيق/لعبة</span>
                </a>
                <button id="static-install-btn" type="button" class="download-btn btn-large action-btn">
                    <i class="fa-solid fa-download"></i>
                    <span id="static-install-text">تثبيت المتجر</span>
                </button>
            </div>

            <h2 id="page-title" class="section-title">الأحدث</h2>
            <div id="loading" class="loading">
                <i class="fa-solid fa-circle-notch fa-spin"></i> <span id="loading-text">جاري التحميل...</span>
            </div>
            <div id="apps-grid" class="apps-grid">
                <!-- App cards injected here -->
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar for Mobile UI -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-view="home">
            <i class="fa-solid fa-house"></i>
            <span class="nav-label">الرئيسية</span>
        </button>
        <button class="nav-item" data-view="games">
            <i class="fa-solid fa-gamepad"></i>
            <span class="nav-label">الألعاب</span>
        </button>
        <button class="nav-item" data-view="apps">
            <i class="fa-solid fa-table-cells-large"></i>
            <span class="nav-label">التطبيقات</span>
        </button>
        <button class="nav-item" data-view="categories">
            <i class="fa-solid fa-layer-group"></i>
            <span class="nav-label">التصنيفات</span>
        </button>
    </nav>

    <!-- App Details Modal -->
    <div id="app-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="modal-header">
                <img id="modal-icon" class="modal-app-icon" src="" alt="App Icon">
                <div class="modal-title-group">
                    <h2 id="modal-title">App Title</h2>
                    <p id="modal-category" class="app-category">Apps</p>
                    <p id="modal-size" class="app-size">0 MB</p>
                </div>
            </div>
            
            <div class="modal-actions">
                <a id="modal-download" href="#" class="download-btn btn-large" target="_blank" rel="noopener noreferrer">
                    <i class="fa-solid fa-download"></i> <span id="download-text">تثبيت</span>
                </a>
            </div>

            <div class="modal-body">
                <h3 id="about-title">حول هذا التطبيق</h3>
                <p id="modal-description" class="app-description"></p>
            </div>
        </div>
    </div>

    <!-- Install Floating Button -->
    <button id="pwa-install-btn" class="pwa-floating-btn" style="display: none;" title="تثبيت المتجر">
        <i class="fa-solid fa-download"></i>
        <span class="pwa-btn-text" id="pwa-btn-text">تثبيت المتجر</span>
    </button>

    <!-- Install Instruction Modal -->
    <div id="install-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <button class="close-modal" id="close-install-modal"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-header" style="justify-content: center; margin-bottom: 1rem;">
                <img class="modal-app-icon" src="assets/logo.jpg" alt="Premium Tech Icon" style="margin: 0 auto; width: 80px; height: 80px;">
            </div>
            <h2 id="install-modal-title" style="margin-bottom: 0.5rem; color: var(--text-primary);">تثبيت المتجر</h2>
            <p id="install-modal-desc" style="color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6;">
                قم بتثبيت التطبيق على جهازك للوصول السريع بدون الحاجة لفتح المتصفح في كل مرة!
            </p>
            <button id="confirm-install-btn" class="download-btn btn-large" style="width: 100%;">
                <i class="fa-solid fa-check"></i> <span id="confirm-install-text">موافق، تثبيت</span>
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('ServiceWorker registration successful with scope: ', reg.scope);
                }).catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
