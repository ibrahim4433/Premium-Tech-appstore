<style>
:root{
  --bg:#030814;--cyan:#00e5ff;--blue:#2f7bff;--violet:#7b5cff;--green:#00ff9d;
  --card:rgba(10,25,60,.5);--border:rgba(0,229,255,.25);--txt:#eaf6ff;--muted:#9fc4e8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;overflow-x:hidden;padding:0 14px 60px;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 15% 8%, rgba(47,123,255,.28), transparent 45%),
    radial-gradient(circle at 85% 12%, rgba(123,92,255,.22), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(0,229,255,.16), transparent 55%),
    linear-gradient(160deg,#030814 0%,#061229 50%,#030814 100%);
}
body::after{
  content:'';position:fixed;top:0;left:0;right:0;height:3px;z-index:50;
  background:linear-gradient(90deg,#00e5ff,#2f7bff,#7b5cff,#00e5ff);
  background-size:300% 100%;animation:shine 3.5s linear infinite;
  box-shadow:0 0 16px rgba(0,229,255,.8);
}
@keyframes shine{to{background-position:300% center}}

.wrap{max-width:1000px;margin:0 auto}
header{text-align:center;padding:34px 0 10px}

.logo{
  display:inline-block;padding:9px;border-radius:20px;
  background:linear-gradient(145deg,rgba(0,229,255,.13),rgba(123,92,255,.10));
  border:1px solid var(--border);box-shadow:0 0 34px rgba(0,229,255,.28);
  position:relative;animation:float 5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.logo img{display:block;width:100%;max-width:520px;border-radius:13px;background:#04122b}

h1{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(1.25rem,5vw,2.1rem);letter-spacing:1.5px;margin:18px 0 6px;
  background:linear-gradient(90deg,#fff,#00e5ff,#7b5cff,#00e5ff,#fff);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:shine 6s linear infinite;
}
.sub{font-size:.85rem;color:var(--muted);letter-spacing:.5px;line-height:1.9}
.sub b{color:var(--cyan)}
.dev{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  font-family:'Cairo',sans-serif;font-weight:800;font-size:.85rem;
  background:linear-gradient(135deg,rgba(0,255,157,.16),rgba(0,229,255,.14));
  border:1px solid rgba(0,255,157,.45);color:#9dffd6;
  padding:8px 18px;border-radius:50px;
  box-shadow:0 0 22px rgba(0,255,157,.22);
}
.team{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:3px;color:var(--cyan);margin-top:10px;text-shadow:0 0 12px rgba(0,229,255,.7)}

.top-links{display:grid;grid-template-columns:1fr;gap:10px;margin:20px 0 6px}
@media(min-width:560px){.top-links{grid-template-columns:1fr 1fr}}
.tlink{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:14px;border-radius:14px;text-decoration:none;color:#eaf6ff;
  font-weight:800;font-size:.86rem;background:rgba(8,22,50,.55);
  border:1px solid var(--border);transition:.28s;

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const tabsEl = document.getElementById('tabs');

let state = { cat:'all', q:'' };

const DL_ICON = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>';
const COPY_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>';

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const q = state.q.trim().toLowerCase();
  const list = APPS.filter(a=>{
    const okCat = state.cat === 'all' || a.cat === state.cat;
    const okQ = !q || a.name.toLowerCase().includes(q) || (a.desc||'').toLowerCase().includes(q);
    return okCat && okQ;
  });

  countEl.textContent = 'عدد العناصر: ' + list.length;

  if(!list.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">🔍 لا توجد نتائج مطابقة</div>';
    return;
  }

  grid.innerHTML = list.map((a,i)=>{
    const tag = a.tag ? `<span class="tag ${a.cat==='iptv'?'iptv':''}">${esc(a.tag)}</span>` : '';
    const ver = a.ver ? `<span class="ver">${esc(a.ver)}</span>` : '';

    const feats = (a.feats||[]).map(f=>{
      const cls = 'feat ' + (f.k||'');
      return `<span class="${cls}">${esc(f.t)}</span>`;
    }).join('');

    const creds = (a.creds||[]).map(c=>`
      <div class="cred">
        <span class="k">${esc(c.k)}</span>
        <span class="v">${esc(c.v)}</span>
        <button class="copy" data-copy="${esc(c.v)}" title="نسخ">${COPY_ICON}</button>
      </div>`).join('');
    const credBox = creds ? `<div class="creds">${creds}</div>` : '';

    const note = a.note ? `<div class="note">⚠️ ${esc(a.note)}</div>` : '';
    const btnText = a.linkText || 'للتنزيل من هنا ⬇️';
    const hash = a.hash ? `<div style="font-size:.7rem;color:#7fa4c9;text-align:center;margin-bottom:8px">${esc(a.hash)}</div>` : '';

    return `
    <article class="card" style="animation-delay:${Math.min(i*0.03,0.5)}s">
      ${tag}
      <div class="card-head">
        <div class="ico">${a.icon}</div>
        <div>
          <div class="name">🧩 تطبيق ${esc(a.name)}</div>
          ${ver}
        </div>
      </div>
      <p class="desc">${esc(a.desc)}</p>
      ${feats ? `<div class="feats">${feats}</div>` : ''}
      ${credBox}
      ${note}
      <div class="channel-line">${CH}</div>
      <a class="btn ${a.cat==='iptv'?'green':''}" href="${esc(a.link)}" target="_blank" rel="noopener">
        ${DL_ICON} ${esc(btnText)}
      </a>
    </article>`;
  }).join('');
}

tabsEl.addEventListener('click', e=>{
  const b = e.target.closest('.tab');
  if(!b) return;
  tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  b.classList.add('active');
  state.cat = b.dataset.cat;
  render();
});

let t;
searchEl.addEventListener('input', e=>{
  clearTimeout(t);
  t = setTimeout(()=>{ state.q = e.target.value; render(); }, 130);
});

grid.addEventListener('click', e=>{
  const b = e.target.closest('.copy');
  if(!b) return;
  const txt = b.dataset.copy;
  const done = ()=>{
    b.classList.add('done');
    b.innerHTML = '✓';
    setTimeout(()=>{ b.classList.remove('done'); b.innerHTML = COPY_ICON; }, 1200);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt, done);
});

function fallback(txt, cb){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}

render();
</script>
