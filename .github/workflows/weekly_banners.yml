name: Generate Weekly Top Banners

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-banners:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install Pillow requests

      - name: Run Weekly Banner Compositor
        run: python scripts/weekly_banners.py

      - name: Commit and Push Updated Banners
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add banners.json assets/banners/generated/
          git diff --cached --quiet && { echo "No banner changes to commit"; exit 0; }
          git commit -m "Auto-update weekly top banners [Hall of Fame & Weekly Picks]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Successfully pushed weekly banners!"
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts."
              exit 1
            fi

            echo "Push rejected, refreshing branch (${attempt}/3)..."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python scripts/weekly_banners.py
            git add banners.json assets/banners/generated/
            git diff --cached --quiet && { echo "No banner changes after refresh"; exit 0; }
            git commit -m "Auto-update weekly top banners [Hall of Fame & Weekly Picks]"
            sleep 2
          done
