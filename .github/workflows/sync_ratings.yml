name: Sync Apps Poll Ratings

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours (twice daily)
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Synchronize all apps instead of active window'
        required: false
        type: boolean
        default: false

jobs:
  sync-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install telethon

      - name: Synchronize Telegram Poll Ratings
        env:
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            python scripts/sync_ratings.py --full
          else
            python scripts/sync_ratings.py
          fi

      - name: Commit and Push Ratings
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps.json
          git diff --cached --quiet && { echo "No rating changes to commit"; exit 0; }
          git commit -m "Auto-sync app ratings from Telegram channel polls"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Successfully pushed updated ratings!"
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts."
              exit 1
            fi

            echo "Push rejected, refreshing branch (${attempt}/3)..."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            python scripts/sync_ratings.py
            git add apps.json
            git diff --cached --quiet && { echo "No rating changes to commit after refresh"; exit 0; }
            git commit -m "Auto-sync app ratings from Telegram channel polls"
            sleep 2
          done
